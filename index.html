<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>闲鱼商品快捷打开</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>闲鱼商品快捷打开（给 Telegram 用）</h1>
      <div class="p">
        使用方法：把下面生成的“中转链接（https）”发到 Telegram，点开后再点一次“打开闲鱼App”。
      </div>
      <small>
        这不是官方接口，仅用于个人自动化。若某次无法拉起App，可点“改用网页打开”。
      </small>
    </div>

    <div style="height:14px"></div>

    <div class="card">
      <h1>生成链接</h1>
      <div class="p">请用目录里的生成脚本 <code>generate_links.py</code> 从商品列表（含 itemId）生成可发 Telegram 的 https 链接。</div>
    </div>
  </div>
</body>
</html>
